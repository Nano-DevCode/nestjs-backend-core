# ==============================================================================
# FAIL2BAN ACTION: BLOQUEO DIRECTO EN LA CADENA DOCKER-USER DE IPTABLES
# ==============================================================================
# En entornos Dockerizados, el tráfico dirigido a puertos expuestos (-p 80:80,
# -p 443:443) salta la cadena INPUT y pasa por FORWARD. La cadena DOCKER-USER es el
# mecanismo oficial provisto por Docker para insertar reglas de filtrado perimetral.

[Definition]

actionstart = iptables -N f2b-<name> 2>/dev/null || true
              iptables -F f2b-<name>
              iptables -A f2b-<name> -j RETURN
              iptables -I DOCKER-USER 1 -p <protocol> -m multiport --dports <port> -j f2b-<name>

actionstop = iptables -D DOCKER-USER -p <protocol> -m multiport --dports <port> -j f2b-<name> 2>/dev/null || true
             iptables -F f2b-<name> 2>/dev/null || true
             iptables -X f2b-<name> 2>/dev/null || true

actioncheck = iptables -n -L DOCKER-USER | grep -q 'f2b-<name>'

actionban = iptables -I f2b-<name> 1 -s <ip> -j DROP

actionunban = iptables -D f2b-<name> -s <ip> -j DROP

[Init]
name = default
port = http,https
protocol = tcp

