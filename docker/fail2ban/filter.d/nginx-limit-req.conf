# ==============================================================================
# FAIL2BAN FILTER: MITIGACIÓN DE BOMBARDEROS Y RATE-LIMITING (HTTP 429)
# ==============================================================================

[Definition]

# Captura cuando la API NestJS (CustomThrottlerGuard) o NGINX emiten HTTP 429 Too Many Requests
failregex = ^<HOST> - .* "(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS) .* HTTP/.*" 429 .*$

ignoreregex =

