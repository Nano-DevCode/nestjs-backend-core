# ==============================================================================
# FAIL2BAN FILTER: ESCANEOS MALICIOSOS Y PETICIONES INVÁLIDAS EN NGINX
# ==============================================================================

[Definition]

# Detecta sondeo activo de archivos sensibles (.env, .git, scripts de php, etc.) o HTTP 400 masivos
failregex = ^<HOST> - .* "(?:GET|POST|HEAD|PUT|DELETE) .*(?:\.env|\.git|\.aws|wp-login|xmlrpc|phpmyadmin|setup\.php|actuator|solr|boaform|cgi-bin|autodiscover|\.sql|\.bak|\.config).* HTTP/.*" (?:400|403|404) .*$
            ^<HOST> - .* ".*" 400 .*$

ignoreregex =
