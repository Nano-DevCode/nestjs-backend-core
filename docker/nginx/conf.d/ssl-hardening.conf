# ==============================================================================
# HARDENING SSL/TLS Y CABECERAS DEFENSIVAS PERIMETRALES (OWASP BEST PRACTICES)
# ==============================================================================

# Protocolos estrictos (se descartan SSLv3, TLSv1.0 y TLSv1.1 obsoletos y vulnerables)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;

# Cifrados criptográficos robustos recomendados por Mozilla Intermediate Configuration
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

# Caché de sesiones TLS en memoria compartida para acelerar handshakes recurrentes
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ------------------------------------------------------------------------------
# Cabeceras de Seguridad Perimetrales Inyectadas a Todo el Tráfico HTTPS
# ------------------------------------------------------------------------------

# HSTS estricto durante 1 año con subdominios y apto para listas de preload de navegadores
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Previene ataques de Clickjacking permitiendo incrustación solo desde el mismo origen
add_header X-Frame-Options "SAMEORIGIN" always;

# Evita que el navegador intente adivinar (MIME-sniffing) el tipo de contenido
add_header X-Content-Type-Options "nosniff" always;

# Activación del filtro XSS reflectivo del navegador
add_header X-XSS-Protection "1; mode=block" always;

# Política de Referrer estricta protegiendo URLs con tokens en la navegación externa
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

