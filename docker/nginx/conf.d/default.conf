# ==============================================================================
# ENRUTAMIENTO PERIMETRAL - UPSTREAMS, REDIRECCIÓN HTTPS Y PROXY PASS
# ==============================================================================

upstream backend_api {
    server api:3000;
    keepalive 32;
}

upstream frontend_app {
    server frontend:80;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. Servidor HTTP (Puerto 80): Desafío ACME y Redirección Forzada 301
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Desafío HTTP-01 de Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirección permanente y forzada a HTTPS para todo el tráfico entrante
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Servidor HTTPS (Puerto 443): Enrutamiento Seguro de Producción
# ------------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # Certificados SSL/TLS (Montados desde volumen de Certbot)
    ssl_certificate     /etc/letsencrypt/live/default/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/default/privkey.pem;

    # Directorio de respaldo para desafíos ACME renovados vía HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # --------------------------------------------------------------------------
    # Archivos y Multimedia S3 / SeaweedFS (Streaming sin Buffering en Disco/RAM)
    # --------------------------------------------------------------------------
    location /api/files/ {
        client_max_body_size 50M;
        proxy_pass http://backend_api;
        include /etc/nginx/conf.d/proxy-headers.conf;

        # Streaming directo hacia NestJS / SeaweedFS para evitar saturación de RAM
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 15s;
    }

    # --------------------------------------------------------------------------
    # API Backend NestJS (Endpoints REST, Autenticación, Auditoría y Logs)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_api;
        include /etc/nginx/conf.d/proxy-headers.conf;

        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 15s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
    }

    # --------------------------------------------------------------------------
    # WebSockets en Tiempo Real (/socket.io y /realtime)
    # --------------------------------------------------------------------------
    location ~ ^/(socket\.io|realtime)/ {
        proxy_pass http://backend_api;
        include /etc/nginx/conf.d/proxy-headers.conf;

        # Negociación y actualización de protocolo hacia WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts de 24h para mantener los túneles persistentes en reposo (keep-alive)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 15s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Frontend SPA (React + Vite)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_app;
        include /etc/nginx/conf.d/proxy-headers.conf;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
