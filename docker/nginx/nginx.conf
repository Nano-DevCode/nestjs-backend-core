# ==============================================================================
# NGINX REVERSE PROXY - CONFIGURACIÓN PRINCIPAL DE ALTO RENDIMIENTO
# ==============================================================================

user nginx;
pid /var/run/nginx.pid;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ocultar la versión exacta de Nginx en cabeceras HTTP y páginas de error
    server_tokens off;

    # Resolver DNS interno de Docker para resolución dinámica de contenedores
    resolver 127.0.0.11 valid=30s ipv6=off;

    # --------------------------------------------------------------------------
    # Formato de Logs Optimizado para Fail2Ban y Auditoría de Latencia
    # --------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=16k flush=2s;
    error_log  /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # Optimizaciones de Socket TCP y Buffers (Anti Slowloris)
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;

    # Timeouts alineados con Express (NestJS keepAliveTimeout: 65s)
    keepalive_timeout 65s;
    keepalive_requests 10000;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;

    # Límites de buffer de cabeceras
    client_header_buffer_size 2k;
    large_client_header_buffers 4 16k;

    # --------------------------------------------------------------------------
    # Compresión Gzip para Respuestas HTTP
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Inclusión de Configuraciones Modulares
    # --------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
