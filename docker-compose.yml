x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '20m'
    max-file: '5'

services:
  # ----------------------------------------------------------------------------
  # 1. Base de Datos PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: sistema_postgres
    restart: always
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - wal_keep_size=512MB
      - -c
      - hot_standby=on
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-MySecretPassword123}
      POSTGRES_DB: ${DB_NAME:-sistema_db}
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replica_secure_pass_123}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-init-replication.sh:/docker-entrypoint-initdb.d/01-init-replication.sh:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sistema_db}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sistema_network
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 1.1 Base de Datos PostgreSQL 16 Réplica de Lectura (Perfil Opcional: with-replica)
  # ----------------------------------------------------------------------------
  postgres-replica:
    image: postgres:16-alpine
    container_name: sistema_postgres_replica
    profiles:
      - with-replica
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/init-replica.sh']
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-MySecretPassword123}
      POSTGRES_DB: ${DB_NAME:-sistema_db}
      PRIMARY_HOST: postgres-db
      PRIMARY_PORT: 5432
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replica_secure_pass_123}
    ports:
      - '${DB_REPLICA_PORT:-5433}:5432'
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./docker/postgres/init-replica.sh:/init-replica.sh:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sistema_db}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sistema_network
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (Caché, Rate-Limiting, Blacklist y Tokens 2FA)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sistema_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-MyRedisSecretPassword123}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          '${REDIS_PASSWORD:-MyRedisSecretPassword123}',
          'ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sistema_network
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 3. Antivirus ClamAV Daemon en Caliente
  # ----------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:stable
    container_name: sistema_clamav
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CLAMAV_PORT:-3310}:3310'
    networks:
      - sistema_network
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 4. Almacenamiento Compatible S3 (SeaweedFS)
  # ----------------------------------------------------------------------------
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: sistema_seaweedfs
    restart: unless-stopped
    ports:
      - '127.0.0.1:${S3_PORT:-8333}:8333'
      - '127.0.0.1:${S3_GRPC_PORT:-9333}:9333'
    command: 'server -dir=/data -s3 -s3.port=8333 -s3.allowEmptyFolder=true'
    environment:
      - WEED_S3_KEY_ID=${S3_ACCESS_KEY:-tu_access_key}
      - WEED_S3_SECRET_KEY=${S3_SECRET_KEY:-tu_secret_key}
    volumes:
      - seaweedfs_data:/data
    networks:
      - sistema_network
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 5. Aplicación NestJS Backend (Producción)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema_api
    restart: unless-stopped
    expose:
      - '3000'
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
      seaweedfs:
        condition: service_started
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-MySecretPassword123}
      - DB_NAME=${DB_NAME:-sistema_db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_POOL_MAX=${DB_POOL_MAX:-25}
      - DB_POOL_MIN=${DB_POOL_MIN:-5}
      - DB_POOL_TIMEOUT_MS=${DB_POOL_TIMEOUT_MS:-5000}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-MySecretPassword123}@postgres-db:5432/${DB_NAME:-sistema_db}?schema=public
      - DATABASE_REPLICA_URL=${DATABASE_REPLICA_URL:-}
      - APP_NAME=${APP_NAME:-Sistema Core}
      - APP_URL=${APP_URL:-https://sistema.nano-service.com}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-MyRedisSecretPassword123}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super_refresh_jwt_key}
      - TWO_FACTOR_ENCRYPTION_KEY=${TWO_FACTOR_ENCRYPTION_KEY}
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-tu_access_key}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-tu_secret_key}
      - S3_BUCKET=${S3_BUCKET:-sistema-files}
      - S3_FORCE_PATH_STYLE=true
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - DOCS_USER=${DOCS_USER:-admin}
      - DOCS_PASSWORD=${DOCS_PASSWORD:-secret123}
      - MAIL_DRIVER=${MAIL_DRIVER:-smtp}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_SECURE=${MAIL_SECURE:-false}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - FRONTEND_URL=${FRONTEND_URL:-https://sistema.nano-service.com,http://localhost:5173,http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-https://sistema.nano-service.com/api/auth/google/callback}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - FACEBOOK_CALLBACK_URL=${FACEBOOK_CALLBACK_URL:-https://sistema.nano-service.com/api/auth/facebook/callback}
      - DISCORD_BOT_ENABLED=${DISCORD_BOT_ENABLED:-false}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - LAVALINK_HOST=${LAVALINK_HOST:-lavalink}
      - LAVALINK_PORT=${LAVALINK_PORT:-2333}
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - LAVALINK_SECURE=${LAVALINK_SECURE:-false}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - ./scripts:/app/scripts:ro
    networks:
      - sistema_network
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 6. Respaldo Automático de PostgreSQL 16 (pg_dump + gzip + rotación cron)
  # ----------------------------------------------------------------------------
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: sistema_postgres_backup
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${DB_NAME:-sistema_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-MySecretPassword123}
      - SCHEDULE=${BACKUP_CRON_POSTGRES:-0 2 * * *}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
      - BACKUP_KEEP_WEEKS=${BACKUP_KEEP_WEEKS:-4}
      - BACKUP_KEEP_MONTHS=${BACKUP_KEEP_MONTHS:-6}
      - BACKUP_DIR=/backups
    volumes:
      - ./backups/postgres:/backups
    networks:
      - sistema_network
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 7. Respaldo Automático de Almacenamiento (SeaweedFS / S3 Files + rotación)
  # ----------------------------------------------------------------------------
  storage-backup:
    build:
      context: ./docker/storage-backup
      dockerfile: Dockerfile
    container_name: sistema_storage_backup
    restart: unless-stopped
    depends_on:
      seaweedfs:
        condition: service_started
    environment:
      - BACKUP_CRON_STORAGE=${BACKUP_CRON_STORAGE:-0 3 * * *}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
      - BACKUP_ON_START=${BACKUP_ON_START:-false}
    volumes:
      - seaweedfs_data:/data:ro
      - ./backups/storage:/backups
    networks:
      - sistema_network
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 8. Frontend SPA Web (Nginx Runner)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../Sistema_Front
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_APP_NAME=Sistema Enterprise
        - VITE_ENABLE_MOCK_FALLBACK=false
        - VITE_FEATURE_DISCORD_BOT=${VITE_FEATURE_DISCORD_BOT:-true}
    container_name: sistema_frontend
    restart: unless-stopped
    expose:
      - '80'
    environment:
      - VITE_API_URL=/api
    networks:
      - sistema_network
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 9. NGINX Reverse Proxy Perimetral con SSL/TLS
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: sistema_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - frontend
    networks:
      - sistema_network
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 10. Certbot (Emisión y Renovación Automática Let's Encrypt cada 12 horas)
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: sistema_certbot
    restart: unless-stopped
    volumes:
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - sistema_network
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 11. Fail2Ban: Detección y Bloqueo de Ataques en Firewall (DOCKER-USER)
  # ----------------------------------------------------------------------------
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: sistema_fail2ban
    restart: unless-stopped
    network_mode: 'host'
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=America/Mexico_City
      - F2B_LOG_LEVEL=INFO
      - F2B_DB_PURGE_AGE=1d
    volumes:
      - ./docker/fail2ban/jail.d:/etc/fail2ban/jail.d:ro
      - ./docker/fail2ban/filter.d:/etc/fail2ban/filter.d:ro
      - ./docker/fail2ban/action.d:/etc/fail2ban/action.d:ro
      - nginx_logs:/var/log/nginx:ro
      - fail2ban_data:/data
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 12. Cloudflare Tunnel (Exposición Segura a Internet sin abrir puertos en router)
  # ----------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sistema_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - sistema_network
    depends_on:
      - nginx
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 13. Nodo de Audio Lavalink v4 (Perfil Opcional: with-lavalink)
  # Levantar con: docker compose --profile with-lavalink up -d
  # ----------------------------------------------------------------------------
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    container_name: sistema_lavalink
    user: root
    profiles:
      - with-lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx1G
      - YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN:-}
    volumes:
      - ./docker/lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink_plugins:/opt/Lavalink/plugins
      - lavalink_data:/opt/Lavalink/data
    ports:
      - '2333:2333'
    networks:
      - sistema_network
    logging: *default-logging

volumes:
  postgres_data:
  postgres_replica_data:
  redis_data:
  seaweedfs_data:
  nginx_logs:
  fail2ban_data:
  lavalink_plugins:
  lavalink_data:

networks:
  sistema_network:
    driver: bridge
