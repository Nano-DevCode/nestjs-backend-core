name: CI / CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-build:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: MySecretPassword123
          POSTGRES_DB: sistema_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        command: redis-server --requirepass MyRedisSecretPassword123
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a MyRedisSecretPassword123 ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:MySecretPassword123@localhost:5432/sistema_db?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: MyRedisSecretPassword123
      JWT_SECRET: super_ci_jwt_secret_key_1234567890
      JWT_REFRESH_SECRET: super_ci_jwt_refresh_secret_9876543210
      TWO_FACTOR_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DISCORD_BOT_ENABLED: false

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Generate Prisma Client
        run: pnpm prisma generate

      - name: 🏗️ Compile TypeScript build
        run: pnpm run build

      - name: 🧪 Run Jest Unit & Integration Tests (100% Coverage)
        run: pnpm test --ci --maxWorkers=2

      - name: 🐳 Validate Dockerfile image build
        run: docker build -t nestjs-backend-core:ci .
